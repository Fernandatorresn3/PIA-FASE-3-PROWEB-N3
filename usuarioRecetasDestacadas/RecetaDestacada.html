<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recetas Destacadas</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 25px;
        }

        h1 {
            text-align: center;
            color: #e67e22;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            padding: 10px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 10px;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-top: 10px;
        }

        .desc {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }

        .btn {
            margin-top: auto;
            padding: 10px;
            background: #3498db;
            text-align: center;
            color: white;
            border-radius: 8px;
            text-decoration: none;
        }

        .btn:hover {
            opacity: .85;
        }

        .empty {
            text-align: center;
            margin-top: 40px;
            font-size: 18px;
            color: #777;
        }
    </style>
</head>

<body>

<h1>Recetas Destacadas</h1>

<div class="grid" id="recipesGrid"></div>
<p id="emptyMsg" class="empty" style="display:none;">No hay recetas destacadas disponibles.</p>

<script>
    const API_URL = "http://localhost:3000";

    $(document).ready(function() {
        $.ajax({
            url: `${API_URL}/recipes/featured`,
            method: "GET",
            success: (recipes) => {
                if (!recipes || recipes.length === 0) {
                    $("#emptyMsg").show();
                    return;
                }

                recipes.forEach(recipe => {
                    $("#recipesGrid").append(`
                        <div class="card">
                            <img src="${recipe.image || 'no-image.png'}" alt="Imagen">
                            <div class="title">${recipe.name}</div>
                            <div class="desc">${recipe.description || 'Sin descripción'}</div>

                            <a class="btn" href="recipe_detail.html?id=${recipe.id}">
                                Ver más
                            </a>
                        </div>
                    `);
                });
            },
            error: () => {
                $("#emptyMsg").text("Error al cargar recetas.").show();
            }
        });
    });
</script>

</body>
</html>
