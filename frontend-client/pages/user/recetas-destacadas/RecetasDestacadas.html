<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Recetas Destacadas</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fafafa;
            margin: 0;
            padding: 0;
        }

        header {
            background: #4CAF50;
            padding: 15px;
            color: white;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            padding: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 18px;
        }

        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px #d8d8d8;
            padding: 15px;
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 6px;
        }

        .card h3 {
            margin: 10px 0;
            font-size: 18px;
        }

        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            margin-top: 8px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }

        .btn-view {
            background: #4CAF50;
            color: white;
        }

        .btn-remove {
            background: #e53935;
            color: white;
        }

        .empty {
            text-align: center;
            margin-top: 40px;
            color: #777;
            font-size: 18px;
        }
    </style>
</head>

<body>

<header>Mis Recetas Destacadas</header>

<div class="container">
    <div id="recetasContainer" class="grid"></div>
    <p id="emptyMsg" class="empty" style="display:none;">No tienes recetas destacadas aún.</p>
</div>

<script>
    const API_URL = "http://localhost:8080/api"; // AJUSTAR A TU BACKEND
    const userId = 1; // CAMBIAR A ID REAL SEGÚN LOGIN

    // Cargar recetas destacadas
    function cargarDestacados() {
        $.ajax({
            url: `${API_URL}/destacados/${userId}`,
            method: "GET",
            success: function (data) {
                if (!data || data.length === 0) {
                    $("#recetasContainer").hide();
                    $("#emptyMsg").show();
                    return;
                }

                $("#emptyMsg").hide();
                $("#recetasContainer").show().empty();

                data.forEach(receta => {
                    $("#recetasContainer").append(`
                        <div class="card">
                            <img src="${receta.imagen_url || 'https://via.placeholder.com/300'}">
                            <h3>${receta.nombre}</h3>
                            
                            <button class="btn btn-view" onclick="verReceta(${receta.id_receta})">
                                Ver Receta
                            </button>

                            <button class="btn btn-remove" onclick="quitarDestacado(${receta.id_receta})">
                                Quitar de Destacados
                            </button>
                        </div>
                    `);
                });
            },
            error: function () {
                alert("Error al cargar recetas destacadas.");
            }
        });
    }

    // Ver receta → va a la pantalla de detalle
    function verReceta(idReceta) {
        window.location.href = `../detalle-receta/DetalleDeReceta.html?id=${idReceta}`;
    }

    // Quitar receta de favoritos
    function quitarDestacado(idReceta) {
        $.ajax({
            url: `${API_URL}/destacados/${userId}/${idReceta}`,
            method: "DELETE",
            success: function () {
                cargarDestacados();
            },
            error: function () {
                alert("No se pudo quitar de destacados.");
            }
        });
    }

    // Cargar al abrir
    cargarDestacados();
</script>

</body>
</html>
