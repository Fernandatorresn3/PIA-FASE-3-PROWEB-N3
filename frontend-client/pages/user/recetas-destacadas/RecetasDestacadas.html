    <header>Mis recetas destacadas</header>


<div class="container">
    <div id="recetasContainer" class="grid"></div>
    <p id="emptyMsg" class="empty" style="display:none;">No tienes recetas destacadas aún.</p>
</div>



<script>
    const API_URL = "http://localhost:8080/api";

    function cargarDestacados() {
        const token = localStorage.getItem("token");

        if (!token) {
            alert("No hay sesión activa.");
            window.location.href = "../../public/login/InicioDeSesion.html";
            return;
        }

        $.ajax({
            url: `${API_URL}/profile/favorites`,
            method: "GET",
            headers: {
                "Authorization": "Bearer " + token
            },
            success: function (data) {

                if (!data || data.length === 0) {
                    $("#recetasContainer").hide();
                    $("#emptyMsg").show();
                    return;
                }

                $("#emptyMsg").hide();
                $("#recetasContainer").show().empty();

                data.forEach(receta => {
                    $("#recetasContainer").append(`
                        <div class="card">
                            <img src="${receta.imagenUrl || 'https://via.placeholder.com/300'}">
                            <h3>${receta.nombre}</h3>

                            <button class="btn btn-view" onclick="verReceta(${receta.id})">
                                Ver Receta
                            </button>

                            <button class="btn btn-remove" onclick="quitarDestacado(${receta.id})">
                                Quitar de Destacados
                            </button>
                        </div>
                    `);
                });
            },
            error: function (xhr) {
                console.error(xhr);
                alert("Error al cargar recetas destacadas.");
            }
        });
    }

    function verReceta(id) {
        window.location.href = `../detalle-receta/DetalleDeReceta.html?id=${id}`;
    }

    function quitarDestacado(idReceta) {
        const token = localStorage.getItem("token");

        $.ajax({
            url: `${API_URL}/profile/favorites/${idReceta}`,
            method: "DELETE",
            headers: {
                "Authorization": "Bearer " + token
            },
            success: function () {
                cargarDestacados();
            },
            error: function () {
                alert("No se pudo quitar de destacados.");
            }
        });
    }

    cargarDestacados();
</script>
    <script>
        // Logout functionality
        $('#logoutBtn').on('click', function(e) {
            e.preventDefault();
            const token = localStorage.getItem('token');
            
            $.ajax({
                url: 'http://localhost:8080/api/auth/logout',
                type: 'POST',
                headers: { 'Authorization': 'Bearer ' + token }
            }).always(function() {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = '../../public/login/InicioDeSesion.html';
            });
        });
    </script>

        <!--LINK ACTIVO-->
   <script>
    $(document).ready(function() {
        const path = window.location.pathname.split("/").pop().toLowerCase();

        $('.navbar-custom .nav-link').each(function() {
            const href = $(this).attr('href').split("/").pop().toLowerCase();
            if(href === path){
                $(this).addClass('current');
            } else {
                $(this).removeClass('current');
            }
        });
    });

       // Insertar botón de Dashboard si el usuario es admin
    function setupAdminButton() {
        const userStr = localStorage.getItem('user');
        if (!userStr) return;
        try {
            const userObj = JSON.parse(userStr);
            // Soportar tanto user.role como user.roles (array) por seguridad
            const isAdmin = (userObj && (userObj.role === 'ROLE_ADMIN' || (Array.isArray(userObj.roles) && userObj.roles.includes('ROLE_ADMIN'))));
            if (isAdmin) {
                const adminBtnHtml = `<a id="adminBtn" class="btn btn-warning btn-sm me-2" href="../../admin/dashboard/appindex.html"><i class="bi bi-speedometer2"></i> Dashboard</a>`;
                const $logout = $('#logoutBtn');
                if ($logout.length) {
                    $logout.before(adminBtnHtml);
                } else {
                    // Fallback: intentar añadir al elemento con id 'navbar' si existe
                    const $nav = $('#navbar');
                    if ($nav.length) {
                        $nav.append(adminBtnHtml);
                    } else {
                        // Si no hay donde insertarlo, loguear para depuración
                        console.warn('No se encontró #logoutBtn ni #navbar para insertar el botón de admin');
                    }
                }
            }
        } catch (err) {
            console.error('Error parsing user from localStorage', err);
        }
    }
    setupAdminButton();
    </script>
