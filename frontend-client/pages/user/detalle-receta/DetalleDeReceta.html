<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Receta</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body { background: #f8f9fa; }
        .recipe-title { font-size: 2rem; font-weight: bold; }
        .star { font-size: 28px; cursor: pointer; color: #ccc; }
        .star.checked { color: gold; }
        .recipe-image { width: 100%; max-height: 350px; object-fit: cover; border-radius: 12px; }
    </style>
</head>

<body class="container py-4">

    <h2 class="mb-3">Detalle de Receta</h2>

    <!-- Contenedor Principal -->
    <div id="recipeContainer" class="card p-4 shadow-sm">
        <img id="recipeImage" class="recipe-image mb-3">
        <h3 id="recipeTitle" class="recipe-title"></h3>
        <p id="recipeDescription"></p>
        <p><strong>Categoría:</strong> <span id="recipeCategory"></span></p>
        <p><strong>Autor:</strong> <span id="recipeAuthor"></span></p>

        <hr>

        <!-- Layout de Ingredientes & Pasos -->
        <div class="row">
            <div class="col-md-6">
                <h5>Ingredientes</h5>
                <ul id="recipeIngredients"></ul>
            </div>

            <div class="col-md-6">
                <h5>Preparación</h5>
                <ol id="recipeSteps"></ol>
            </div>
        </div>

        <hr>

        <!-- Sección de interacción -->
        <div>
            <h5>Calificación Promedio:  
                <span id="avgRating"></span>
            </h5>

            <div id="ratingStars" class="mb-3">
                <!-- Estrellas dinámicas -->
            </div>

            <button id="favButton" class="btn btn-outline-danger mb-3">
                ❤️ Guardar en Favoritos
            </button>

            <button class="btn btn-secondary mb-3" onclick="window.print()">
                🖨 Imprimir
            </button>
        </div>

        <hr>

        <!-- Comentarios -->
        <h5>Comentarios</h5>
        <div id="commentsList" class="mb-3"></div>

        <textarea id="commentText" class="form-control mb-2" placeholder="Escribe un comentario..."></textarea>
        <button id="sendComment" class="btn btn-primary">Enviar comentario</button>

    </div>

    <script>
        const API_URL = "http://localhost:8080/api";
        const token = localStorage.getItem("token");
        const recipeId = new URLSearchParams(window.location.search).get("id");

        if (!recipeId) {
            alert("No se envió el ID de la receta.");
        }

        // ============================
        // 1. Cargar detalle de receta
        // ============================
        function loadRecipe() {
            $.ajax({
                url: `${API_URL}/recipes/${recipeId}`,
                type: "GET"
            }).done(function (r) {
                $("#recipeTitle").text(r.titulo);
                $("#recipeDescription").text(r.descripcion);
                $("#recipeAuthor").text(r.autorNombre);
                $("#recipeCategory").text(r.categoriaNombre);
                $("#avgRating").text(r.calificacionPromedio.toFixed(1));

                // Mostrar Imagen
                if (r.imagenUrl) {
                    let file = r.imagenUrl.split("/").pop();
                    $("#recipeImage").attr("src", `${API_URL}/files/images/${file}`);
                }

                // Ingredientes → vienen como texto separado por saltos de línea
                $("#recipeIngredients").empty();
                r.ingredientes.split("\n").forEach(i => {
                    $("#recipeIngredients").append(`<li>${i}</li>`);
                });

                // Pasos
                $("#recipeSteps").empty();
                r.instrucciones.split("\n").forEach(p => {
                    $("#recipeSteps").append(`<li>${p}</li>`);
                });

                loadRatingStars(r.calificacionPromedio);
            });
        }

        // ============================
        // 2. Cargar comentarios
        // ============================
        function loadComments() {
            $.ajax({
                url: `${API_URL}/recipes/${recipeId}/comments`,
                type: "GET"
            }).done(function (comments) {
                if (!comments || comments.length === 0) {
                    $("#commentsList").html("<p class='text-muted'>No hay comentarios aún.</p>");
                    return;
                }
                $("#commentsList").empty();
                comments.forEach(c => {
                    $("#commentsList").append(`
                        <div class="p-2 border rounded mb-2">
                            <strong>${c.usuarioNombre}</strong> 
                            <small class="text-muted">${c.fechaCreacion}</small>
                            <p>${c.contenido}</p>
                        </div>
                    `);
                });
            }).fail(function (xhr) {
                console.error("Error al cargar comentarios:", xhr.status, xhr.responseText);
                $("#commentsList").html("<p class='text-danger'>Error al cargar comentarios.</p>");
            });
        }

        // ============================
        // 3. Enviar comentario
        // ============================
        $("#sendComment").click(function () {
            if (!token) {
                alert("Debes iniciar sesión para comentar.");
                return;
            }

            let text = $("#commentText").val().trim();
            if (!text) {
                alert("Escribe un comentario antes de enviar.");
                return;
            }

            $.ajax({
                url: `${API_URL}/recipes/${recipeId}/comments`,
                type: "POST",
                contentType: "application/json",
                headers: { Authorization: "Bearer " + token },
                data: JSON.stringify({ contenido: text })
            }).done(function () {
                alert("Comentario enviado (pendiente de aprobación).");
                $("#commentText").val("");
                loadComments();
            }).fail(function (xhr) {
                console.error("Error al enviar comentario:", xhr.status, xhr.responseText);
                alert("Error al enviar comentario. Intenta de nuevo.");
            });
        });

        // ============================
        // 4. Estrellas de calificación
        // ============================
        function loadRatingStars(currentAvg) {
            $("#ratingStars").empty();
            for (let i = 1; i <= 5; i++) {
                $("#ratingStars").append(`
                    <span class="star ${i <= Math.round(currentAvg) ? "checked" : ""}" 
                          data-value="${i}">★</span>
                `);
            }

            $(".star").click(function () {
                if (!token) return alert("Inicia sesión para calificar.");

                let value = $(this).data("value");
                $.ajax({
                    url: `${API_URL}/recipes/${recipeId}/ratings`,
                    type: "POST",
                    contentType: "application/json",
                    headers: { Authorization: "Bearer " + token },
                    data: JSON.stringify({ puntuacion: value })
                }).done(function () {
                    alert("¡Gracias por tu calificación!");
                    loadRecipe(); // actualiza promedio
                });
            });
        }

        // ============================
        // 5. Manejo de favoritos
        // ============================
        let isFavorite = false;

        function checkFavorite() {
            if (!token) {
                console.warn("No hay token. Usuario debe iniciar sesión.");
                return;
            }

            $.ajax({
                url: `${API_URL}/profile/favorites`,
                type: "GET",
                headers: { Authorization: "Bearer " + token }
            }).done(function (favorites) {
                if (favorites && Array.isArray(favorites)) {
                    isFavorite = favorites.some(f => f.id == recipeId);
                    updateFavButton();
                }
            }).fail(function (xhr) {
                console.error("Error al verificar favoritos:", xhr.status, xhr.responseText);
            });
        }

        function updateFavButton() {
            if (isFavorite) {
                $("#favButton").text("💔 Quitar de favoritos");
                $("#favButton").removeClass("btn-outline-danger");
                $("#favButton").addClass("btn-danger");
            } else {
                $("#favButton").text("❤️ Guardar en favoritos");
                $("#favButton").removeClass("btn-danger");
                $("#favButton").addClass("btn-outline-danger");
            }
        }

        $("#favButton").click(function () {
            if (!token) {
                alert("Debes iniciar sesión para guardar favoritos.");
                return;
            }

            if (isFavorite) {
                $.ajax({
                    url: `${API_URL}/profile/favorites/${recipeId}`,
                    type: "DELETE",
                    headers: { Authorization: "Bearer " + token }
                }).done(function () {
                    isFavorite = false;
                    updateFavButton();
                    alert("Receta removida de favoritos.");
                }).fail(function (xhr) {
                    console.error("Error al quitar de favoritos:", xhr.status, xhr.responseText);
                    alert("Error al quitar de favoritos.");
                });
            } else {
                $.ajax({
                    url: `${API_URL}/profile/favorites/${recipeId}`,
                    type: "POST",
                    headers: { Authorization: "Bearer " + token }
                }).done(function () {
                    isFavorite = true;
                    updateFavButton();
                    alert("Receta añadida a favoritos.");
                }).fail(function (xhr) {
                    console.error("Error al agregar a favoritos:", xhr.status, xhr.responseText);
                    alert("Error al agregar a favoritos.");
                });
            }
        });

        // ============================
        // Inicializar pantalla
        // ============================
        loadRecipe();
        loadComments();
        checkFavorite();

    </script>

</body>
</html>
