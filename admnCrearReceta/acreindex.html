<!--CONTENIDO RECETA NUEVA-->
<div class="main-content">
    <h2 class="text-center mb-4 text-dark">Nueva Receta</h2>
    <form id="newRecipeForm" class="recipe-form">

        <div class="mb-3">
            <label for="recipeName" class="form-label">Nombre receta</label>
            <input type="text" class="form-control form-control-oval" id="recipeName" placeholder="Ej: Tacos de birria" maxlength="100" required>
        </div>

        <div class="mb-3">
            <label for="shortDescription" class="form-label">Descripción corta </label>
            <input type="text" class="form-control form-control-oval" id="shortDescription" placeholder="Ej: Tacos tipicos de México" maxlength="100" required>
        </div>

        <div class="mb-3">
            <label for="countryOrigin" class="form-label">País de origen</label>
            <input type="text" class="form-control form-control-oval" id="countryOrigin" placeholder="Ej:México"  required>
        </div>

        <div class="mb-3">
            <label for="category" class="form-label">Categoría</label>
            <select class="form-select form-control-oval" id="category" required>
                <option value="">Selecciona una cateogoría</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="Ingredients" class="form-label">Ingredientes</label>
            <textarea class="form-control form-control-oval" id="ingredients" rows="6" placeholder="Ej:500g de carne, tortillas.." required></textarea>
        </div>

        <div class="mb-3">
            <label for="steps" class="form-label">Pasos</label>
            <textarea class="form-control form-control-oval" id="steps" rows="7" placeholder="Ej: 1.Cortar carne..2.Agregar cebolla" required></textarea>
        </div>

        <div class="d-flex justify-content-between">
            <button type="button" class="btn btn-secondary" id="cancelBtn">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar receta</button>
        </div>  
    </form>
</div>
